<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crystal Rush | Game On Assessment</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>// The whole game is drawn on one HTML canvas.const c=document.getElementById("c"),x=c.getContext("2d");const W=800,H=500,keys={};let level=1,gem=0,collected=0,state="start";let audio,musicStarted=false,musicTimer;function resize(){c.width=innerWidth;c.height=innerHeight}resize();onresize=resize;// Each player has a position, size, colour, score and lives.const p1={x:40,y:80,w:26,h:26,c:"#2f7cff",score:0,lives:3,name:"P1"};const p2={x:734,y:434,w:26,h:26,c:"#22b573",score:0,lives:3,name:"P2"};// The obstacle positions for each of the three levels.const maps=[[],[{x:350,y:100,w:100,h:35},{x:350,y:365,w:100,h:35}],[{x:190,y:70,w:35,h:330},{x:575,y:100,w:35,h:330},{x:330,y:230,w:140,h:35}],[{x:120,y:120,w:560,h:30},{x:120,y:350,w:560,h:30},{x:385,y:150,w:30,h:200}]];// Each level has three crystals to collect in order.const gems=[[],[{x:90,y:90},{x:690,y:90},{x:390,y:440}],[{x:90,y:390},{x:390,y:80},{x:690,y:390}],[{x:70,y:70},{x:710,y:70},{x:710,y:410}]];// Each level uses its own background and obstacle colours.const themes=[{},{sky:"#cceeff",ground:"#bde3a2",wall:"#6d8d45",name:"Garden"},{sky:"#ffe6b3",ground:"#e5c07b",wall:"#9b6b32",name:"Desert"},{sky:"#17172b",ground:"#27274a",wall:"#ff3b81",name:"Neon"}];// Make sound effects without downloading copyrighted music.function sound(f,t=.08,v=.04){ if(!audio)audio=new AudioContext(); const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination); o.start();o.stop(audio.currentTime+t);}// Play a short repeating tune using simple musical notes.function startMusic(){ if(musicStarted)return; musicStarted=true;audio=new AudioContext(); const notes=[262,330,392,523,392,330,294,349]; let n=0; musicTimer=setInterval(()=>sound(notes[n++%notes.length],.15,.018),300);}// Player 1 uses WASD; Player 2 uses the arrow keys.onkeydown=e=>{ if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault(); keys[e.key.toLowerCase()]=1; startMusic(); if(state==="start"&&e.key==="Enter")state="play"; if((state==="win"||state==="gameover")&&e.key==="Enter"){restart();state="play"}};onkeyup=e=>keys[e.key.toLowerCase()]=0;// Check whether two rectangles overlap.function touch(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}// Start a completely new game.function restart(){ level=1;gem=0;collected=0; Object.assign(p1,{x:40,y:80,score:0,lives:3}); Object.assign(p2,{x:734,y:434,score:0,lives:3});}// Obstacles remove a life; players return to their starting place.function hit(p){ p.lives--;sound(120,.12,.06); if(p.lives<=0){state="gameover";return} p.x=p===p1?40:734; p.y=p===p1?80:434;}// Change a player position from the keys, without leaving the map.function move(p,u,d,l,r){ let ox=p.x,oy=p.y; if(keys[u])p.y-=4;if(keys[d])p.y+=4;if(keys[l])p.x-=4;if(keys[r])p.x+=4; p.x=Math.max(0,Math.min(W-p.w,p.x)); p.y=Math.max(60,Math.min(H-p.h,p.y)); for(const o of maps[level])if(touch(p,o)){p.x=ox;p.y=oy;hit(p);break}}// Collect a crystal, update score, then go to the next level.function collect(p){ const g={...gems[level][gem],w:20,h:20}; if(touch(p,g)){  p.score++;collected++;gem=(gem+1)%3;sound(700,.1,.05);  if(collected>=3){   if(level<3){    level++;gem=0;collected=0;    p1.x=40;p1.y=80;p2.x=734;p2.y=434;sound(950,.2,.05);   }else state="win";  } }}function player(p){ x.save(); x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=8; x.fillStyle=p.c;x.beginPath();x.roundRect(p.x,p.y,p.w,p.h,7);x.fill(); x.shadowBlur=0; x.fillStyle="white";x.fillRect(p.x+6,p.y+7,5,5);x.fillRect(p.x+15,p.y+7,5,5); x.fillStyle="#111";x.fillRect(p.x+8,p.y+8,2,2);x.fillRect(p.x+17,p.y+8,2,2); x.restore();}function crystal(g){ const t=performance.now()/300,s=10+Math.sin(t)*2; x.save();x.translate(g.x+10,g.y+10);x.rotate(t/3); x.fillStyle="#ffd51f";x.beginPath(); x.moveTo(0,-s);x.lineTo(s,0);x.lineTo(0,s);x.lineTo(-s,0);x.closePath();x.fill(); x.restore();}function obstacle(o){ const T=themes[level]; x.fillStyle=T.wall;x.fillRect(o.x,o.y,o.w,o.h); x.fillStyle="rgba(255,255,255,.16)"; for(let i=0;i<o.w;i+=20)x.fillRect(o.x+i,o.y,8,o.h);}function background(){ const T=themes[level]; x.fillStyle=T.sky;x.fillRect(0,0,W,H); x.fillStyle=T.ground;x.fillRect(0,60,W,H-60); if(level===1){  for(let i=0;i<8;i++){x.fillStyle="#5b9c55";x.beginPath();x.arc(60+i*105,440,35,0,7);x.fill()} } if(level===2){  x.fillStyle="#d6ad60";for(let i=0;i<6;i++)x.fillRect(i*150,420,80,8); } if(level===3){  x.strokeStyle="rgba(0,255,255,.13)";  for(let i=0;i<800;i+=40){x.beginPath();x.moveTo(i,60);x.lineTo(i,500);x.stroke()}  for(let i=60;i<500;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(800,i);x.stroke()} }}function hud(){ x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,0,W,60); x.fillStyle="white";x.font="bold 18px Arial"; x.fillText("Level "+level+" - "+themes[level].name,15,24); x.fillText("P1  Score: "+p1.score+"  Lives: "+p1.lives,15,48); x.fillText("P2  Score: "+p2.score+"  Lives: "+p2.lives,555,48);}function overlay(title,text){ x.fillStyle="rgba(0,0,0,.68)";x.fillRect(0,0,W,H); x.textAlign="center";x.fillStyle="white"; x.font="bold 48px Arial";x.fillText(title,W/2,190); x.font="22px Arial";x.fillText(text,W/2,240); x.font="18px Arial";x.fillText("Press ENTER",W/2,285); x.textAlign="left";}function startScreen(){ background(); x.fillStyle="rgba(0,0,0,.48)";x.fillRect(0,0,W,H); x.textAlign="center"; x.fillStyle="white";x.font="bold 54px Arial";x.fillText("CRYSTAL RUSH",W/2,145); x.font="22px Arial";x.fillText("Collect 3 crystals in each level and avoid obstacles.",W/2,205); x.font="20px Arial";x.fillText("Player 1: WASD",W/2,255); x.fillText("Player 2: Arrow Keys",W/2,285); x.font="bold 22px Arial";x.fillText("Press ENTER to Start",W/2,350); x.textAlign="left";}// Redraw the game every frame (the game loop).function game(){ x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height); x.save(); // Keep the map at the correct shape on different screen sizes. const scale=Math.min(c.width/W,c.height/H); x.translate((c.width-W*scale)/2,(c.height-H*scale)/2); x.scale(scale,scale); if(state==="start"){startScreen();x.restore();requestAnimationFrame(game);return} if(state==="play"){  move(p1,"w","s","a","d");  if(state==="play")move(p2,"arrowup","arrowdown","arrowleft","arrowright");  if(state==="play")collect(p1);  if(state==="play")collect(p2); } background(); for(const o of maps[level])obstacle(o); crystal({...gems[level][gem],w:20,h:20}); player(p1);player(p2);hud(); if(state==="win")overlay("YOU WIN!","Both players completed all 3 levels."); if(state==="gameover")overlay("GAME OVER","A player lost all their lives."); x.restore();requestAnimationFrame(game);}game();</script></body></html>
